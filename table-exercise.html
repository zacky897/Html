<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Schedule</title>
</head>
<body>
    <h2>Class X ICT Weekly Schedule</h2>

        <!-- Table Header -->
         <thead>
        <tr>

            <th colspan="3">Subjects</th>
        </tr>
        <tr>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
        </tr>
        </thead>
        <!-- Table Body -->
        <tbody>
        <tr>
            <td rowspan="2">Monday</td>
            <td>07:00 - 08:30</td>
            <td>HTML Fundamentals</td>
            <td>CSS Basics</td>
            <td>Database Concept</td>
        </tr>
        <tr>
            <td>Afternoon</td>
            <td>13.00 - 14.30</td>
            <td colspan="3">Web Development Project</td>
        </tr>
        </tbody>
        <!-- Table Footer -->
        <tfoot>
        <tr>
            <td colspan="5">ICT Program - SMA Al-Abidin Bilingual Boarding School</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
