<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <h2>Create Form in HTML</h2>
    <form>
        <h2>student registration form</h2>
        <label>Fullname</label><br>
        <input type="text" name="name" placeholder="Enter your name" required><br>
        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your E-mail" required><br>
        <label>Password</label><br>
        <input type="password" name="password" placeholder="Enter your password" required><br>
        <label>Date Of Birth</label><br>
        <input type="date" name="birthday" required><br>
        <label>Class</label><br>
        <select>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
        </select><br>
        <label>Gender</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female<br>
        <label>Skills</label><br>
    <input type="checkbox">HTML
    <input type="checkbox">CSS
    <input type="checkbox">JavaScript<br>
    <label>About Yourself</label><br>
    <textarea rows="4" cols="40" placeholder="Write about yourself here..."></textarea><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    </form>
</body>
</html>
