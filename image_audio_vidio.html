<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h2>Image in HTML</h2>
        <img src="image project.png" width="150" height="150"><br>
        <img src="logo.png" width="150" height="150" alt="prabperoro">

        <h2>Audio in HTML</h2>
        <audio controls>
            <source src="audio project.mp3" type="audio/mp3">
        </audio>

        <h2>Video in HTML</h2>
        <video width="320" height="240" controls>
            <source src="video project.mp4" type="video/mp4">
        </video><br>
</body> 
</html>
